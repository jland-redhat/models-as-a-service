apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: maas-api-opendatahub-praxis

# Same as overlays/odh, but uses the Praxis IPP base.
# Selected when maas-controller has MAAS_IPP_PROFILE=praxis.
# Resources keep payload-processing names; annotated maas.opendatahub.io/ipp-profile=praxis.
resources:
- ../../../../deployment/base/maas-api/overlays/tls
- ../../../../deployment/base/maas-controller/policies
- ../../../../deployment/base/payload-processing-praxis/default

namespace: opendatahub

patches:
- target:
    kind: NetworkPolicy
    name: payload-processing
  patch: |-
    - op: replace
      path: /spec/ingress/0/from/0/podSelector
      value:
        matchLabels:
          gateway.istio.io/managed: istio.io-gateway-controller

labels:
- pairs:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: maas-api
