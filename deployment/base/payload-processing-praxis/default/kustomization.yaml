apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Praxis ExtProc IPP stack (selected via MAAS_IPP_PROFILE=praxis → odh-praxis overlay).
# Resource names match llm-d payload-processing so the shared reconciler patchers apply;
# maas.opendatahub.io/ipp-profile=praxis marks them as the Praxis implementation.
resources:
  - ../manager
  - ../rbac
  - ../networking

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: models-as-a-service
      app.kubernetes.io/component: payload-processing
      app.kubernetes.io/name: payload-processing

commonAnnotations:
  maas.opendatahub.io/ipp-profile: praxis
